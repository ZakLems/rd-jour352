<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>In-class graphics</title>
	</head>
	<body>
		<h1>Maryland Heating</h1>
		<iframe
			title="Projected number of extreme heat events by county, for the year 2040, based on Regional Climate-Weather Research and Forecasting Model"
			aria-label="Choropleth map"
			id="datawrapper-chart-1f27j"
			src="https://datawrapper.dwcdn.net/1f27j/1/"
			scrolling="no"
			frameborder="0"
			style="width: 0; min-width: 100% !important; border: none"
			height="462"
			data-external="1"
		></iframe>
		<script type="text/javascript">
			(function () {
				function e() {
					window.addEventListener(`message`, function (e) {
						if (e.data[`datawrapper-height`] !== void 0) {
							var t = document.querySelectorAll(`iframe`);
							for (var n in e.data[`datawrapper-height`])
								for (var r = 0, i; (i = t[r]); r++)
									if (i.contentWindow === e.source) {
										var a = e.data[`datawrapper-height`][n] + `px`;
										i.style.height = a;
									}
						}
					});
				}
				e();
			})();
		</script>
		<br />
		<iframe
			title="The relationship between summer temperature and poverty in Baltimore"
			aria-label="Scatter Plot"
			id="datawrapper-chart-r4PJl"

							var t = document.querySelectorAll(`iframe`);
							for (var n in e.data[`datawrapper-height`])
								for (var r = 0, i; (i = t[r]); r++)
									if (i.contentWindow === e.source) {
										var a = e.data[`datawrapper-height`][n] + `px`;
										i.style.height = a;
									}
						}
					});
				}
				e();
			})();
		</script>
	</body>
</html>
