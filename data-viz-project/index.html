			<iframe
				title="Over a quarter of Florida's total executions occurred in 2025 and 2026"
				aria-label="Column Chart"
				id="datawrapper-chart-6oR2v"
				src="https://datawrapper.dwcdn.net/6oR2v/1/"
				scrolling="no"
				frameborder="0"
				style="width: 0; min-width: 100% !important; border: none"
				height="449"
				data-external="1"
			></iframe>
			<script type="text/javascript">
				(function () {
					function e() {
						window.addEventListener(`message`, function (e) {
							if (e.data[`datawrapper-height`] !== void 0) {
								var t = document.querySelectorAll(`iframe`);
								for (var n in e.data[`datawrapper-height`])
									for (var r = 0, i; (i = t[r]); r++)
										if (i.contentWindow === e.source) {
											var a = e.data[`datawrapper-height`][n] + `px`;
											i.style.height = a;
										}
							}
						});
					}
					e();
				})();
			</script>
